name: infinite_sight
description: "A new Flutter project."
publish_to: 'none'  # Ensures not published to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^6.6.0  # Updated if newer version is available and compatible
  flutter_tts: ^4.0.2
  cupertino_icons: ^1.0.8
  dash_chat_2: ^0.0.20
  googleai_dart: ^0.1.0
  translator: ^1.0.0
  connectivity_plus: ^6.0.3  # Updated to latest compatible version
  language_tool: ^2.2.0
  lottie: ^3.1.0
  camera: ^0.11.0
  tflite_v2: ^1.0.0  # Verify for updates or consider alternatives
  image_picker: ^1.0.8
  palette_generator: ^0.3.3+3
  colornames: ^0.1.0
  permission_handler: ^11.3.1
  flutter_launcher_icons: ^0.13.1
  flutter_sound: ^9.2.13
  path_provider: ^2.1.3
  record: ^4.4.4
  just_audio: ^0.9.38
  on_audio_query: ^2.9.0
  flutter_local_notifications: ^17.2.1
  shared_preferences: ^2.2.3
  android_alarm_manager_plus: ^2.0.0
  flutter_background: ^1.2.0
  

dev_dependencies:
 
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0  # Updated to latest version

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  image: ^3.0.2
  meta: ^1.11.0  # Review and potentially remove override if not necessary